name: Release
on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  build-and-release-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    environment: release
    if: github.event_name != 'workflow_dispatch' || github.ref_protected
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify tag matches pubspec.yaml version
        if: github.event_name != 'workflow_dispatch'
        run: |
          TAG_NAME="${{ github.ref_name }}"
          EXPECTED_VERSION="${TAG_NAME#v}"
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          if [ "$EXPECTED_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "Tag $TAG_NAME does not match pubspec.yaml version $PUBSPEC_VERSION. Bump pubspec.yaml before tagging."
            exit 1
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1
      - name: Install secretspec
        run: |
          curl -sSL https://install.secretspec.dev | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Fetch release keystore from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: op read --out-file android/release.jks "op://kompanion/kompanion_app_signing/release.jks"
      - name: Build Android APKs (split per ABI)
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: secretspec run --profile ci -- flutter build apk --release --split-per-abi
      - name: Prepare APK artifacts
        run: |
          TAG_NAME="${{ github.ref_name }}"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "kompanion-${TAG_NAME}-${abi}.apk"
          done
      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kompanion-${{ github.ref_name }}-armeabi-v7a.apk
            kompanion-${{ github.ref_name }}-arm64-v8a.apk
            kompanion-${{ github.ref_name }}-x86_64.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.ref_protected
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
